changes = [
    "diff",
    "--from",
    "main",
    "--to",
    "@",
]

# Light-touch spell check of commit descriptions: `jj spell [REVSET]`
# (default: everything between trunk and the working copy). Prints one line per
# commit that has suspected typos and nothing for clean ones; it always exits 0
# so it can sit in a chain without blocking anything. Needs `codespell`.
spell = [
    "util",
    "exec",
    "--",
    "bash",
    "-uc",
'''
command -v codespell >/dev/null 2>&1 || { echo "codespell not installed" >&2; exit 0; }
revset="${1:-trunk()..@}"
while IFS= read -r -d $'\x1e' record; do
    change="${record%%$'\x1f'*}"
    description="${record#*$'\x1f'}"
    typos="$(printf '%s\n' "$description" | codespell --stdin-single-line - 2>/dev/null \
        | sed 's/^[0-9]*: //' | paste -sd ';' - | sed 's/;/; /g')"
    if [ -n "$typos" ]; then
        printf '%s  %s\n    %s\n' "$change" "${description%%$'\n'*}" "$typos"
    fi
done < <(jj log --ignore-working-copy --no-graph -r "$revset" \
    -T 'change_id.shortest(8) ++ "\x1f" ++ description ++ "\x1e"')
exit 0
''',
    "jj-spell",
]

# Data for the fish prompt (see `_prompt_jj` in .config/fish/functions).
# One tab-separated row per revision: the working copy plus the nearest
# bookmark behind and ahead of it, so the prompt needs a single jj call.
# Columns: role, empty, conflict, description, change id, commit id, bookmarks
# (a trailing `*` on a bookmark means it differs from its remote). Fields are
# joined with explicit `\t`, not `separate()`, which would drop empty ones.
prompt = [
    "log",
    "--no-graph",
    "--color=never",
    "--revisions",
    "@ | heads(::@ & bookmarks()) | heads(@:: & bookmarks())",
    "--template",
    "prompt_row",
]

[template-aliases]
prompt_row = '''
if(self.contained_in("@"), "cur",
    if(self.contained_in("heads(@:: & bookmarks())"), "ahead", "behind"))
++ "\t" ++ empty
++ "\t" ++ conflict
++ "\t" ++ description.first_line()
++ "\t" ++ change_id.shortest()
++ "\t" ++ commit_id.shortest()
++ "\t" ++ local_bookmarks.map(|b| b.name() ++ if(b.synced(), "", "*")).join(" ")
++ "\n"
'''

